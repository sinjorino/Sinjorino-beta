<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Nunito:wght@300;400;600&family=Italiana&display=swap" rel="stylesheet">
<style>
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
:root{--ink:#f2f2f2;--mut:#8a8a8a;--line:#2a2a2a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}

.app{height:100%;display:grid;grid-template-columns:54.5% 1fr}
.map{position:relative;overflow:hidden}
@keyframes fade{from{opacity:0}}
#net{position:absolute;inset:0}

.map::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.8));pointer-events:none}
@keyframes scan{to{left:115%}}
.side{position:relative;border-left:1px solid var(--line);display:flex;flex-direction:column;padding:0 24px;min-height:0}

header{display:flex;align-items:center;gap:18px;padding:22px 0 18px;border-bottom:1px solid var(--line);position:relative}
.logo{width:50px;height:50px;flex:none}
.rg{transform-box:fill-box;transform-origin:center;animation:spin 22s linear infinite}
.wv{transform-box:fill-box;transform-origin:center;stroke-dasharray:6 3;animation:flow 1.6s linear infinite,amp 3.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-18}}
@keyframes amp{50%{transform:scaleY(1.45)}}
h1{font-weight:600;font-size:15px;letter-spacing:.42em;background:linear-gradient(90deg,rgb(var(--ac)) 30%,#777 50%,rgb(var(--ac)) 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
#sub{font-size:11px;color:var(--mut);margin-top:5px;font-weight:500;transition:color .4s}
.busy #sub{color:rgb(var(--ac))}
.mem{margin-left:auto;font:inherit;font-size:11px;color:var(--mut);background:none;border:1px solid var(--line);padding:6px 10px;cursor:pointer;transition:.3s}
.mem:hover{color:#000;background:rgb(var(--ac));border-color:rgb(var(--ac))}
.pop{display:none;position:absolute;right:0;top:78px;z-index:5;width:280px;padding:14px;font-size:12px;line-height:1.6;background:#0a0a0a;border:1px solid #444}
.pop.on{display:block;animation:rise .35s both}
.pop div{padding:5px 0;border-bottom:1px solid #222}
.pop button{margin-top:10px;font:inherit;font-size:11px;color:var(--mut);background:none;border:1px solid var(--line);padding:5px 10px;cursor:pointer}
.msgs{flex:1;min-height:0;overflow:auto;padding:18px 0;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.msgs::-webkit-scrollbar{display:none}
.m{border:1px solid rgba(var(--ac),.22);background:rgba(0,0,0,.6);padding:14px 16px;font-size:13.5px;line-height:1.75;max-width:92%;white-space:pre-wrap;overflow-wrap:anywhere;animation:rise .55s cubic-bezier(.2,.8,.2,1) both;position:relative}
.m::before{display:block;font-size:9.5px;letter-spacing:.35em;color:#6d6d6d;margin-bottom:7px}
.m.a::before{content:"SINJORINO"}
.m.u::before{content:"VOCÊ"}
.m.u{align-self:flex-end;border-color:rgba(var(--ac),.55);background:rgba(var(--ac),.06)}
.m.a{align-self:flex-start}
.m.live::after{content:"▍";animation:blink 1s steps(1) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(12px);filter:blur(5px)}}
.tg{display:inline-block;margin:12px 8px 0 0;font:inherit;font-size:11.5px;color:var(--ink);background:none;border:1px solid #555;padding:6px 10px;cursor:pointer;transition:.25s}
.tg:hover{background:rgb(var(--ac));color:#000;transform:translateY(-2px)}
.barw{padding:12px 0 22px}
.bar{position:relative;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;border-radius:14px;background:linear-gradient(180deg,rgba(var(--ac),.1),rgba(var(--ac),.035));border:1px solid rgba(var(--ac),.16);box-shadow:inset 0 1px 0 rgba(var(--ac),.2),0 10px 40px rgba(0,0,0,.6);transition:.4s}
.bar::before{content:"";position:absolute;inset:-1px;border-radius:15px;padding:1px;pointer-events:none;background:conic-gradient(from var(--a),transparent 0 62%,rgba(var(--ac),.95) 82%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);opacity:.3;transition:opacity .4s;animation:rot 4s linear infinite}
@keyframes rot{to{--a:360deg}}
.bar:focus-within{background:linear-gradient(180deg,rgba(var(--ac),.14),rgba(var(--ac),.05));box-shadow:inset 0 1px 0 rgba(var(--ac),.3),0 0 0 4px rgba(var(--ac),.06),0 0 40px rgba(var(--ac),.12)}
.bar:focus-within::before,.busy .bar::before{opacity:1}
.pr{color:rgb(var(--ac));font-weight:600;animation:blink 1.2s steps(1) infinite}
#in{flex:1;min-width:0;background:none;border:0;outline:0;color:rgb(var(--ac));font:inherit;font-size:14px}
#in::placeholder{color:#7d7d7d}
kbd{font:inherit;font-size:10px;color:#777;border:1px solid #3a3a3a;padding:3px 6px;border-radius:5px}
#go{width:44px;height:44px;border:0;border-radius:10px;background:rgb(var(--ac));color:#000;cursor:pointer;display:grid;place-items:center;transition:.25s}
#go:hover{transform:translateY(-2px) scale(1.05);box-shadow:0 0 28px rgba(var(--ac),.45)}
#go:active{transform:scale(.93)}
.busy #go{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 30px rgba(var(--ac),.7)}}
:root{--line:rgba(var(--ac),.09)}
.m,#in{font-family:"Nunito","IBM Plex Mono",ui-rounded,system-ui,sans-serif}
.m::before{font-family:"IBM Plex Mono",monospace;opacity:.8}
.m{font-size:15px;line-height:1.65;border:1px solid rgba(var(--ac),.1);border-radius:20px;background:rgba(var(--ac),.04);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.m.u{border-color:rgba(var(--ac),.2);background:rgba(var(--ac),.09);border-bottom-right-radius:7px}
.m.a{border-bottom-left-radius:7px}
.tg{border:1px solid rgba(var(--ac),.16);border-radius:999px}
.mem{border-radius:999px;border-color:rgba(var(--ac),.12)}
.pop{border:1px solid rgba(var(--ac),.12);border-radius:18px;background:rgba(14,14,14,.82);backdrop-filter:blur(18px)}
.bar{border-radius:22px;border-color:rgba(var(--ac),.12)}
.bar::before{border-radius:23px;background:conic-gradient(from var(--a),transparent 0 66%,rgba(var(--ac),.55) 84%,transparent 100%);animation-duration:7s}
#go{border-radius:16px;background:linear-gradient(180deg,rgb(var(--ac)),#d6d6da)}
#in{font-size:15px}
.bg{display:none}
@keyframes fl1{to{transform:translate(30vw,22vh) scale(1.2)}}
@keyframes fl2{to{transform:translate(-34vw,-18vh) scale(1.15)}}
@keyframes fl3{to{transform:translate(26vw,-24vh) scale(1.25)}}
@keyframes breathe{50%{transform:scale(1.35);opacity:.5}}
@keyframes tw{from{opacity:.12}to{opacity:.55}}
@media(max-width:820px){
:root{--hh:60px}
.app{display:block;position:relative;z-index:1;height:calc(var(--vh,100dvh) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:hidden}

.side{position:absolute;inset:0;border:0;padding:0 16px}

.bg .core{width:46vw;height:46vw;left:27vw;top:20%;filter:blur(30px);background:radial-gradient(circle,rgba(var(--ac),.1),transparent 70%);animation:breathe 7s ease-in-out infinite}
.bg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20% 30%,rgb(var(--ac)),transparent),radial-gradient(1px 1px at 70% 20%,rgb(var(--ac)),transparent),radial-gradient(1.5px 1.5px at 40% 70%,rgb(var(--ac)),transparent),radial-gradient(1px 1px at 85% 60%,rgb(var(--ac)),transparent),radial-gradient(1px 1px at 10% 85%,rgb(var(--ac)),transparent),radial-gradient(1px 1px at 60% 90%,rgb(var(--ac)),transparent),radial-gradient(1px 1px at 90% 8%,rgb(var(--ac)),transparent);animation:tw 5s ease-in-out infinite alternate}

}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@keyframes unhide{to{opacity:1}}

.ig{position:relative;display:flex;flex-direction:column;align-items:center;gap:24px}
.ilogo{width:96px;height:96px;overflow:visible;filter:drop-shadow(0 0 14px rgba(var(--ac),.35))}
.d1,.d2{stroke-dasharray:1;stroke-dashoffset:1;stroke-width:1.6;stroke-linecap:round;animation:draw 1.4s .2s cubic-bezier(.6,0,.2,1) forwards}
.d2{stroke-width:2;animation-delay:.8s}
@keyframes draw{to{stroke-dashoffset:0}}
.rings{position:absolute;left:50%;top:48px}
.rings i{position:absolute;left:0;top:0;width:96px;height:96px;margin:-48px 0 0 -48px;border:1px solid rgba(var(--ac),.35);border-radius:50%;opacity:0;animation:ring 3s .9s ease-out infinite}
.rings i:nth-child(2){animation-delay:1.6s}.rings i:nth-child(3){animation-delay:2.3s}
@keyframes ring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(4.5);opacity:0}}
.iname{display:flex;font-size:30px;font-weight:600;letter-spacing:.42em;margin-right:-.42em;height:40px}

@keyframes letter{to{opacity:1;filter:blur(0);transform:none}}
.ibar{width:220px;height:1px;background:#222;overflow:hidden}
.ibar b{display:block;height:100%;background:rgb(var(--ac));transform:scaleX(0);transform-origin:left;animation:load 2.2s .8s cubic-bezier(.5,0,.2,1) forwards}
@keyframes load{to{transform:scaleX(1)}}
.icount{font-size:11px;color:#8a8a8a;letter-spacing:.15em;height:14px}
.iskip{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));font-size:10px;letter-spacing:.3em;color:#555;text-transform:uppercase;animation:blink 2s steps(1) infinite}
@media(max-width:820px){.iname{font-size:22px}}

#auth{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;visibility:hidden;transition:opacity .7s,visibility 0s .7s;overflow:auto}
#auth.show{opacity:1;visibility:visible;transition:opacity .7s}
.acard{width:min(380px,100%);padding:28px 26px 24px;border-radius:30px;background:linear-gradient(145deg,rgba(var(--ac),.1),rgba(var(--ac),.03));border:1px solid rgba(var(--ac),.12);box-shadow:inset 0 1px 0 rgba(var(--ac),.22),0 30px 90px rgba(0,0,0,.7);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);transform:translateY(30px) scale(.96);opacity:0;filter:blur(8px);transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .9s,filter .9s;font-family:"Nunito",sans-serif}

.alogo{display:block;width:54px;height:54px;margin:0 auto 8px;filter:drop-shadow(0 0 12px rgba(var(--ac),.3))}

.tabs b.on{color:#000}
.tabs .ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:linear-gradient(180deg,rgb(var(--ac)),#d8d8dc);transition:transform .5s cubic-bezier(.7,0,.2,1)}
.acard.up .ind{transform:translateX(100%)}
.f{display:block;max-height:62px;margin-bottom:12px;overflow:hidden;transition:max-height .6s cubic-bezier(.7,0,.2,1),opacity .5s,margin .6s}

.f input{width:100%;padding:15px 18px;border-radius:16px;background:rgba(var(--ac),.07);border:1px solid rgba(var(--ac),.1);color:rgb(var(--ac));font:inherit;font-size:16px;outline:0;transition:.35s}

@keyframes spinr{to{transform:rotate(360deg)}}

@font-face{font-family:"Vonca";font-weight:300;font-display:swap;src:url(fonts/vonca-light.woff2) format("woff2"),url(fonts/vonca-light.woff) format("woff"),url(fonts/vonca-light.otf) format("opentype"),url(fonts/vonca-light.ttf) format("truetype")}

@keyframes lwave{to{transform:translateX(-24px)}}
@keyframes swell{50%{transform:scaleY(1.22)}}
.d3,.d4{stroke-dasharray:1;stroke-dashoffset:1;stroke-linecap:round;animation:draw 1.4s 1.1s cubic-bezier(.6,0,.2,1) forwards}

async function boot(){

  sb=supabase.createClient(c.url,c.key);
  sb.auth.onAuthStateChange((ev,s)=>{dbg('evento: '+ev);if(ev==='SIGNED_OUT'&&user)leave();if(ev==='SIGNED_IN'&&s&&!user&&booted)setTimeout(()=>enterApp(s.user),0)});
  const {data}=await sb.auth.getSession();
  dbg('sessão: '+(data.session?'sim':'não'));
  if(data.session)await enterApp(data.session.user);
 }catch(e){const m=(e&&e.message)||String(e);dbg('erro: '+m);aerr(m==='cfg'||m==='lib'?'O servidor ainda não está conectado ao Supabase. Veja o LEIA-ME.':'Algo falhou ao entrar: '+m)}
 booted=true;route();
}
