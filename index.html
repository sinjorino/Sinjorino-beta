<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"><title>Sinjorino</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">
<style>
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
:root{--ink:#f2f2f2;--mut:#8a8a8a;--line:#2a2a2a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#000;color:var(--ink);font-family:"IBM Plex Mono",Consolas,ui-monospace,monospace;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:grid;grid-template-columns:54.5% 1fr}
.map{position:relative;overflow:hidden}
@keyframes fade{from{opacity:0}}
#net{position:absolute;inset:0}
.map::before{content:"";position:absolute;top:0;bottom:0;width:16%;left:-20%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);animation:scan 7s linear infinite;pointer-events:none}
.map::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.8));pointer-events:none}
@keyframes scan{to{left:115%}}
.side{position:relative;border-left:1px solid var(--line);display:flex;flex-direction:column;padding:0 24px;min-height:0}
@keyframes slide{from{opacity:0;transform:translateX(24px)}}
header{display:flex;align-items:center;gap:18px;padding:22px 0 18px;border-bottom:1px solid var(--line);position:relative}
.logo{width:50px;height:50px;flex:none}
.rg{transform-box:fill-box;transform-origin:center;animation:spin 22s linear infinite}
.wv{transform-box:fill-box;transform-origin:center;stroke-dasharray:6 3;animation:flow 1.6s linear infinite,amp 3.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-18}}
@keyframes amp{50%{transform:scaleY(1.45)}}
h1{font-weight:600;font-size:15px;letter-spacing:.42em;background:linear-gradient(90deg,#fff 30%,#777 50%,#fff 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
#sub{font-size:11px;color:var(--mut);margin-top:5px;font-weight:500;transition:color .4s}
.busy #sub{color:#fff}
.mem{margin-left:auto;font:inherit;font-size:11px;color:var(--mut);background:none;border:1px solid var(--line);padding:6px 10px;cursor:pointer;transition:.3s}
.mem:hover{color:#000;background:#fff;border-color:#fff}
.pop{display:none;position:absolute;right:0;top:78px;z-index:5;width:280px;padding:14px;font-size:12px;line-height:1.6;background:#0a0a0a;border:1px solid #444}
.pop.on{display:block;animation:rise .35s both}
.pop div{padding:5px 0;border-bottom:1px solid #222}
.pop button{margin-top:10px;font:inherit;font-size:11px;color:var(--mut);background:none;border:1px solid var(--line);padding:5px 10px;cursor:pointer}
.msgs{flex:1;min-height:0;overflow:auto;padding:18px 0;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.msgs::-webkit-scrollbar{display:none}
.m{border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.6);padding:14px 16px;font-size:13.5px;line-height:1.75;max-width:92%;white-space:pre-wrap;overflow-wrap:anywhere;animation:rise .55s cubic-bezier(.2,.8,.2,1) both;position:relative}
.m::before{display:block;font-size:9.5px;letter-spacing:.35em;color:#6d6d6d;margin-bottom:7px}
.m.a::before{content:"SINJORINO"}
.m.u::before{content:"VOCÊ"}
.m.u{align-self:flex-end;border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.06)}
.m.a{align-self:flex-start}
.m.live::after{content:"▍";animation:blink 1s steps(1) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(12px);filter:blur(5px)}}
.tg{display:inline-block;margin:12px 8px 0 0;font:inherit;font-size:11.5px;color:var(--ink);background:none;border:1px solid #555;padding:6px 10px;cursor:pointer;transition:.25s}
.tg:hover{background:#fff;color:#000;transform:translateY(-2px)}
.barw{padding:12px 0 22px}
.bar{position:relative;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 10px 40px rgba(0,0,0,.6);transition:.4s}
.bar::before{content:"";position:absolute;inset:-1px;border-radius:15px;padding:1px;pointer-events:none;background:conic-gradient(from var(--a),transparent 0 62%,rgba(255,255,255,.95) 82%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);opacity:.3;transition:opacity .4s;animation:rot 4s linear infinite}
@keyframes rot{to{--a:360deg}}
.bar:focus-within{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 0 4px rgba(255,255,255,.06),0 0 40px rgba(255,255,255,.12)}
.bar:focus-within::before,.busy .bar::before{opacity:1}
.pr{color:#fff;font-weight:600;animation:blink 1.2s steps(1) infinite}
#in{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:14px}
#in::placeholder{color:#7d7d7d}
kbd{font:inherit;font-size:10px;color:#777;border:1px solid #3a3a3a;padding:3px 6px;border-radius:5px}
#go{width:44px;height:44px;border:0;border-radius:10px;background:#fff;color:#000;cursor:pointer;display:grid;place-items:center;transition:.25s}
#go:hover{transform:translateY(-2px) scale(1.05);box-shadow:0 0 28px rgba(255,255,255,.45)}
#go:active{transform:scale(.93)}
.busy #go{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 30px rgba(255,255,255,.7)}}
:root{--line:rgba(255,255,255,.09)}
.m,#in{font-family:"Nunito","IBM Plex Mono",ui-rounded,system-ui,sans-serif}
.m::before{font-family:"IBM Plex Mono",monospace;opacity:.8}
.m{font-size:15px;line-height:1.65;border:1px solid rgba(255,255,255,.1);border-radius:20px;background:rgba(255,255,255,.04);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.m.u{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.09);border-bottom-right-radius:7px}
.m.a{border-bottom-left-radius:7px}
.tg{border:1px solid rgba(255,255,255,.16);border-radius:999px}
.mem{border-radius:999px;border-color:rgba(255,255,255,.12)}
.pop{border:1px solid rgba(255,255,255,.12);border-radius:18px;background:rgba(14,14,14,.82);backdrop-filter:blur(18px)}
.bar{border-radius:22px;border-color:rgba(255,255,255,.12)}
.bar::before{border-radius:23px;background:conic-gradient(from var(--a),transparent 0 66%,rgba(255,255,255,.55) 84%,transparent 100%);animation-duration:7s}
#go{border-radius:16px;background:linear-gradient(180deg,#fff,#d6d6da)}
#in{font-size:15px}
.bg{display:none}
@keyframes fl1{to{transform:translate(30vw,22vh) scale(1.2)}}
@keyframes fl2{to{transform:translate(-34vw,-18vh) scale(1.15)}}
@keyframes fl3{to{transform:translate(26vw,-24vh) scale(1.25)}}
@keyframes breathe{50%{transform:scale(1.35);opacity:.5}}
@keyframes tw{from{opacity:.12}to{opacity:.55}}
@media(max-width:820px){

.side{position:absolute;inset:0;border:0;padding:0 16px}

.msgs>:first-child{margin-top:auto}

.tg{padding:10px 14px}
.barw{padding:8px 0 14px}
#in{font-size:16px}
kbd{display:none}
#go{width:46px;height:46px}
.bg{display:block;position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0;transition:filter 1s}
.bg i{position:absolute;border-radius:50%;filter:blur(60px);will-change:transform}
.bg .o1{width:75vw;height:75vw;left:-25vw;top:-10vw;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 68%);animation:fl1 16s ease-in-out infinite alternate}
.bg .o2{width:70vw;height:70vw;right:-30vw;top:28%;background:radial-gradient(circle,rgba(255,255,255,.1),transparent 68%);animation:fl2 21s ease-in-out infinite alternate}
.bg .o3{width:80vw;height:80vw;left:-10vw;bottom:-30vw;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 68%);animation:fl3 25s ease-in-out infinite alternate}
.bg .core{width:46vw;height:46vw;left:27vw;top:20%;filter:blur(30px);background:radial-gradient(circle,rgba(255,255,255,.1),transparent 70%);animation:breathe 7s ease-in-out infinite}
.bg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#fff,transparent),radial-gradient(1px 1px at 85% 60%,#fff,transparent),radial-gradient(1px 1px at 10% 85%,#fff,transparent),radial-gradient(1px 1px at 60% 90%,#fff,transparent),radial-gradient(1px 1px at 90% 8%,#fff,transparent);animation:tw 5s ease-in-out infinite alternate}

}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.app:not(.go) .map,.app:not(.go) .side{opacity:0;animation:unhide 0s 8s forwards}

.app.go .side{animation:slide 1s .15s cubic-bezier(.2,.8,.2,1) both}
@keyframes unhide{to{opacity:1}}
#intro{position:fixed;inset:0;z-index:50;background:#000;display:grid;place-items:center;cursor:pointer;transition:opacity 1s,filter 1s,transform 1.2s cubic-bezier(.7,0,.2,1);animation:gone 0s 9s forwards}

@keyframes gone{to{opacity:0;visibility:hidden;pointer-events:none}}
.ig{position:relative;display:flex;flex-direction:column;align-items:center;gap:24px}
.ilogo{width:96px;height:96px;overflow:visible;filter:drop-shadow(0 0 14px rgba(255,255,255,.35))}
.d1,.d2{stroke-dasharray:1;stroke-dashoffset:1;stroke-width:1.6;stroke-linecap:round;animation:draw 1.4s .2s cubic-bezier(.6,0,.2,1) forwards}
.d2{stroke-width:2;animation-delay:.8s}
@keyframes draw{to{stroke-dashoffset:0}}
.rings{position:absolute;left:50%;top:48px}
.rings i{position:absolute;left:0;top:0;width:96px;height:96px;margin:-48px 0 0 -48px;border:1px solid rgba(255,255,255,.35);border-radius:50%;opacity:0;animation:ring 3s .9s ease-out infinite}
.rings i:nth-child(2){animation-delay:1.6s}.rings i:nth-child(3){animation-delay:2.3s}
@keyframes ring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(4.5);opacity:0}}
.iname{display:flex;font-size:30px;font-weight:600;letter-spacing:.42em;margin-right:-.42em;height:40px}
.iname span{opacity:0;filter:blur(10px);transform:translateY(10px);animation:letter .8s forwards}
@keyframes letter{to{opacity:1;filter:blur(0);transform:none}}
.ibar{width:220px;height:1px;background:#222;overflow:hidden}
.ibar b{display:block;height:100%;background:#fff;transform:scaleX(0);transform-origin:left;animation:load 2.2s .8s cubic-bezier(.5,0,.2,1) forwards}
@keyframes load{to{transform:scaleX(1)}}
.icount{font-size:11px;color:#8a8a8a;letter-spacing:.15em;height:14px}
.iskip{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));font-size:10px;letter-spacing:.3em;color:#555;text-transform:uppercase;animation:blink 2s steps(1) infinite}
@media(max-width:820px){.iname{font-size:22px}}

#auth{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;visibility:hidden;transition:opacity .7s,visibility 0s .7s;overflow:auto}
#auth.show{opacity:1;visibility:visible;transition:opacity .7s}
.acard{width:min(380px,100%);padding:28px 26px 24px;border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 30px 90px rgba(0,0,0,.7);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);transform:translateY(30px) scale(.96);opacity:0;filter:blur(8px);transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .9s,filter .9s;font-family:"Nunito",sans-serif}
#auth.show .acard{transform:none;opacity:1;filter:none}
#auth.out .acard{transform:translateY(-24px) scale(1.07);opacity:0;filter:blur(14px)}
.acard.shake{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
#auth.show .acard>*{animation:rise .8s both}
#auth.show .acard>:nth-child(2){animation-delay:.15s}#auth.show .acard>:nth-child(3){animation-delay:.25s}#auth.show .acard>:nth-child(n+4){animation-delay:.35s}#auth.show .acard>:nth-child(n+8){animation-delay:.45s}
.alogo{display:block;width:54px;height:54px;margin:0 auto 8px;filter:drop-shadow(0 0 12px rgba(255,255,255,.3))}
.asub{text-align:center;color:#8d8d92;font:500 11px "IBM Plex Mono",monospace;letter-spacing:.28em;text-transform:uppercase}
.tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;margin:18px 0 18px;padding:4px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.tabs b{position:relative;z-index:1;text-align:center;padding:9px 0;font-size:13px;font-weight:600;color:#8d8d92;cursor:pointer;transition:color .4s}
.tabs b.on{color:#000}
.tabs .ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:linear-gradient(180deg,#fff,#d8d8dc);transition:transform .5s cubic-bezier(.7,0,.2,1)}
.acard.up .ind{transform:translateX(100%)}
.f{display:block;max-height:62px;margin-bottom:12px;overflow:hidden;transition:max-height .6s cubic-bezier(.7,0,.2,1),opacity .5s,margin .6s}
.fu,.fc{max-height:0;opacity:0;margin-bottom:0}
.acard.up .fu,.acard.up .fc{max-height:62px;opacity:1;margin-bottom:12px}
.f input{width:100%;padding:15px 18px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:#fff;font:inherit;font-size:16px;outline:0;transition:.35s}
.f input:focus{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35)}
.f input::placeholder{color:#7d7d84}
.aerr{max-height:0;overflow:hidden;font-size:13px;color:#ececef;text-align:center;opacity:0;transition:.4s}
.aerr.on{max-height:60px;opacity:1;margin:2px 0 12px}
.abtn{position:relative;width:100%;padding:15px;border:0;border-radius:16px;background:linear-gradient(180deg,#fff,#d6d6da);color:#000;font:600 15px "Nunito",sans-serif;cursor:pointer;overflow:hidden;transition:transform .25s,box-shadow .25s}
.abtn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(255,255,255,.2)}

.abtn .spin{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px;border:2px solid rgba(0,0,0,.2);border-top-color:#000;border-radius:50%;opacity:0;animation:spinr .8s linear infinite}
.abtn.load span{opacity:0}.abtn.load .spin{opacity:1}
@keyframes spinr{to{transform:rotate(360deg)}}
.or{display:flex;align-items:center;gap:12px;margin:16px 0;color:#6f6f76;font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.1)}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#fff;font:600 15px "Nunito",sans-serif;cursor:pointer;transition:.3s}

.me{flex:none;width:34px;height:34px;margin-left:10px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font:600 13px "Nunito",sans-serif;cursor:pointer;transition:.3s}

.hist{display:flex;align-items:center;gap:8px;padding:10px 0 4px}

.hl::-webkit-scrollbar{display:none}

/* Modo de voz — avatar original do Sinjorino */
#voiceBtn{margin-left:8px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(255,255,255,.06);color:#fff;padding:8px 12px;font:inherit;font-size:11px;cursor:pointer;white-space:nowrap}

@keyframes voiceIn{from{opacity:0;filter:blur(10px)}to{opacity:1;filter:blur(0)}}
.vtop{display:flex;align-items:center;justify-content:space-between;padding:22px 26px;position:relative;z-index:2}
.vbrand{font:500 11px "IBM Plex Mono",monospace;letter-spacing:.35em;color:#aaa}

.avatarWrap{width:min(78vw,520px);height:min(74vh,620px);position:relative;z-index:1;display:grid;place-items:center;filter:drop-shadow(0 12px 45px rgba(255,255,255,.10))}
.avatar{height:100%;width:100%;overflow:visible}
.avatar .bodyGlow{fill:url(#metal);stroke:#aaa;stroke-width:1.5}
.avatar .detail{fill:none;stroke:#ddd;stroke-width:1.4;opacity:.65}
.avatar .faceLine{fill:none;stroke:#f4f4f4;stroke-width:2;stroke-linecap:round}
.avatar .eye{fill:#fff;filter:drop-shadow(0 0 5px #fff)}
.avatar .mouth{fill:#050505;stroke:#eee;stroke-width:1.4;transform-origin:250px 210px;transition:transform .08s ease}
.avatar .arm{fill:url(#metal);stroke:#bcbcbc;stroke-width:1.5;transform-box:fill-box;transform-origin:center;transition:transform .65s cubic-bezier(.2,.8,.2,1)}
.avatar .hand{fill:#d7d7d7;stroke:#fff;stroke-width:1}
.avatar.pose-cross .armL{transform:translate(68px,-32px) rotate(-48deg)}
.avatar.pose-cross .armR{transform:translate(-68px,-32px) rotate(48deg)}

 if(b){for(let i=0;i<14;i++)spawn(nodes[Math.floor(R()*LY[0].n)])}else{$('#sub').textContent=subIdle();nodes.forEach(n=>n.g=Math.max(n.g,.7))}}
const sc=()=>{const m=$('#msgs');m.scrollTop=m.scrollHeight};
function add(c,t){if(c==='u')AP.classList.add('chatting');const d=document.createElement('div');d.className='m '+c;d.textContent=t;$('#msgs').append(d);sc();return d}
const drawMem=()=>$('#mc').textContent=facts.length;
const nome=()=>user?((user.user_metadata&&(user.user_metadata.usuario||user.user_metadata.full_name||user.user_metadata.name))||(user.email||'').split('@')[0]):'';
function hello(){const hi=add('a','Olá, '+nome()+'! Eu sou o Sinjorino, uma rede neural com milhões de neurônios. Pergunte qualquer coisa, ou ensine algo com “ensinar: pergunta = resposta”.');
 [['o que é uma rede neural?',1],['ensinar: ',0]].forEach(([q,s])=>{const b=document.createElement('button');b.className='tg';b.textContent=q.trim();b.onclick=()=>{if(s)send(q);else{$('#in').value=q;$('#in').focus()}};hi.append(b)})}
function render(){$('#msgs').textContent='';AP.classList.remove('chatting');hello();hist.forEach(m=>add(m.role==='user'?'u':'a',m.content));$('#sub').textContent=subIdle()}
function drawHist(){const l=$('#hl');l.textContent='';convs.forEach(c=>{const b=document.createElement('button');b.className='hc'+(c.id===cur?' on':'');b.title=c.titulo;const t=document.createElement('span');t.className='t';t.textContent=c.titulo;b.append(t);b.onclick=()=>openConv(c.id);
 if(c.id===cur){const x=document.createElement('i');x.textContent='×';x.title='Apagar conversa';x.onclick=e=>{e.stopPropagation();delConv(c.id)};b.append(x)}l.append(b)})}
function newConv(){if(busy)return;cur=null;hist=[];drawHist();render();$('#in').focus()}
async function openConv(id){if(busy||id===cur)return;const r=await sb.from('mensagens').select('papel,conteudo').eq('conversa_id',id).order('id');if(r.error)return;cur=id;hist=(r.data||[]).map(m=>({role:m.papel,content:m.conteudo}));drawHist();render()}
async function delConv(id){if(busy||!confirm('Apagar esta conversa?'))return;await sb.from('conversas').delete().eq('id',id);convs=convs.filter(c=>c.id!==id);if(id===cur)newConv();else drawHist()}
async function ensureConv(t){if(cur)return;const r=await sb.from('conversas').insert({titulo:t.replace(/\s+/g,' ').slice(0,38)}).select('id,titulo').single();if(r.error)throw r.error;cur=r.data.id;convs.unshift(r.data);drawHist()}
async function persist(rows){if(!cur)return;try{await sb.from('mensagens').insert(rows.map(r=>({conversa_id:cur,papel:r.role,conteudo:r.content})));await sb.from('conversas').update({atualizada_em:new Date().toISOString()}).eq('id',cur);const i=convs.findIndex(c=>c.id===cur);if(i>0){convs.unshift(convs.splice(i,1)[0]);drawHist()}}catch(e){}}
async function loadAll(){const [m,c]=await Promise.all([sb.from('memorias').select('texto').order('id'),sb.from('conversas').select('id,titulo').order('atualizada_em',{ascending:false}).limit(40)]);
 facts=(m.data||[]).map(x=>x.texto);convs=c.data||[];cur=null;hist=[];drawMem();drawHist();render()}
async function api(body){
 const {data}=await sb.auth.getSession();const tk=data.session&&data.session.access_token;
 let r;try{r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tk},body:JSON.stringify(body)})}catch(e){throw new Error('Sem conexão com o servidor. Verifique sua internet.')}
 const d=await r.json().catch(()=>({}));
 if(r.status===401)setTimeout(()=>sb.auth.signOut(),1800);
 if(!r.ok)throw new Error(d.error||('O servidor não respondeu (erro '+r.status+'). Confira se a pasta api com o arquivo chat.js foi enviada ao GitHub.'));
 return d}
async function learn(t){
 if(t.length<20)return;
 try{const d=await api({task:'facts',text:t});
  if(Array.isArray(d.facts)){const nv=d.facts.filter(f=>typeof f==='string'&&f&&!facts.includes(f)).map(f=>f.slice(0,120));
   if(nv.length){const r=await sb.from('memorias').insert(nv.map(texto=>({texto})));if(!r.error){facts.push(...nv);drawMem()}}}
 }catch(e){}
}
async function type(el,text){const st=Math.max(2,Math.ceil(text.length/110));for(let i=0;i<text.length;i+=st){el.textContent=text.slice(0,i+st);sc();await new Promise(r=>setTimeout(r,16))}el.textContent=text}
async function send(txt,fromVoice=false){
 if(busy||!txt)return;
 const tm=txt.match(/^ensinar:\s*(.+?)\s*=\s*(.+)$/i);
 add('u',txt);
 try{await ensureConv(txt)}catch(e){}
 if(tm){const f='ensinado: “'+tm[1].slice(0,80)+'” → “'+tm[2].slice(0,120)+'”',rp='Aprendido. Agora sei responder “'+tm[1]+'”.';
  hist.push({role:'user',content:txt},{role:'assistant',content:rp});add('a',rp);nodes.forEach(n=>n.g=1);
  const r=await sb.from('memorias').insert({texto:f});if(!r.error){facts.push(f);drawMem()}
  persist([{role:'user',content:txt},{role:'assistant',content:rp}]);$('#sub').textContent=subIdle();return}
 hist.push({role:'user',content:txt});
 const el=add('a','');el.classList.add('live');setBusy(true);
 try{
  let m=hist.slice(-14);while(m.length&&m[0].role!=='user')m.shift();
  const d=await api({messages:m,facts});
  await type(el,d.text);if(fromVoice||voiceOpen)speakAnswer(d.text);hist.push({role:'assistant',content:d.text});persist([{role:'user',content:txt},{role:'assistant',content:d.text}]);learn(txt);
  outK=Math.abs([...d.text].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7))%11;outG=1;nodes[nodes.length-11+outK].g=1;
 }catch(e){
  hist.pop();el.textContent=(e&&e.message)||'Não consegui responder agora. Tente novamente em instantes.';
 }finally{el.classList.remove('live');setBusy(false)}
}
function go(){const v=$('#in').value.trim();if(!v||busy)return;$('#in').value='';send(v)}
$('#go').onclick=go;$('#newc').onclick=newConv;
$('#in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go()}});
function togglePop(k,fill){if(pop.classList.contains('on')&&pop.dataset.k===k){pop.classList.remove('on');return}pop.dataset.k=k;pop.textContent='';fill();pop.classList.add('on')}
function popBtn(t,fn){const b=document.createElement('button');b.textContent=t;b.onclick=fn;pop.append(b)}
$('#mem').onclick=()=>togglePop('m',()=>{
 if(!facts.length){pop.textContent='Ainda não guardei nada sobre você.';return}
 facts.forEach(f=>{const d=document.createElement('div');d.textContent=f;pop.append(d)});
 popBtn('esquecer tudo',async()=>{await sb.from('memorias').delete().gt('id',-1);facts=[];drawMem();pop.classList.remove('on')})});
$('#me').onclick=()=>togglePop('u',()=>{const d=document.createElement('div');d.textContent=nome();pop.append(d);if(user&&user.email){const e=document.createElement('div');e.style.color='#8a8a8a';e.textContent=user.email;pop.append(e)}if(user&&semSenha(user))popBtn('definir senha',()=>{pop.classList.remove('on');manualPw=true;pendingPw=true;setMode('pw');$('#askip').textContent='voltar';AUTH.classList.add('show')});popBtn('sair',()=>{pop.classList.remove('on');sb.auth.signOut()})});

// ----- login / criar conta -----
const aerr=t=>{const e=$('#aerr');e.textContent=t;e.classList.toggle('on',!!t);if(t){CARD.classList.remove('shake');void CARD.offsetWidth;CARD.classList.add('shake')}};
const tr=m=>/Invalid login/i.test(m)?'E-mail ou senha incorretos.':/already registered|already exists/i.test(m)?'Esse e-mail já tem conta. Use “Entrar”.':/at least|weak/i.test(m)?'Senha fraca. Use 6 ou mais caracteres.':/valid email|invalid.*email|email.*invalid/i.test(m)?'E-mail inválido.':/rate limit|too many/i.test(m)?'Muitas tentativas. Espere um pouco.':/same password|different from the old/i.test(m)?'Use uma senha diferente da atual.':/not enabled/i.test(m)?'O login com Google ainda não foi ativado no Supabase.':'Não deu certo: '+m;
function setMode(m){mode=m;CARD.classList.toggle('up',m==='up');CARD.classList.toggle('pw',m==='pw');$('#tin').classList.toggle('on',m!=='up');$('#tup').classList.toggle('on',m==='up');$('#ago span').textContent=m==='in'?'Entrar':m==='up'?'Criar conta':'Salvar senha';$('#asub').textContent=m==='in'?'bem-vindo de volta':m==='up'?'crie sua conta':'defina sua senha';$('#ap').autocomplete=m==='in'?'current-password':'new-password';aerr('')}
$('#tin').onclick=()=>setMode('in');$('#tup').onclick=()=>setMode('up');
async function submit(){
 if(loading||!sb)return;
 if(mode==='pw'){const pw=$('#ap').value;if(pw.length<6)return aerr('A senha precisa ter pelo menos 6 caracteres.');if(pw!==$('#ac').value)return aerr('As senhas não são iguais.');
  loading=true;$('#ago').classList.add('load');aerr('');
  try{const r=await sb.auth.updateUser({password:pw,data:{senha_ok:true,senha_def:true}});if(r.error)throw r.error;if(r.data&&r.data.user)user=r.data.user;pendingPw=false;if(manualPw){manualPw=false;closeAuth();setMode('in')}else await finish()}catch(err){aerr(tr(err.message||String(err)))}
  loading=false;$('#ago').classList.remove('load');return}
 const u=$('#au').value.trim(),e=$('#ae').value.trim(),p=$('#ap').value;
 if(!e||!p)return aerr('Preencha e-mail e senha.');
 if(mode==='up'){if(u.length<3)return aerr('Escolha um nome de usuário com 3 ou mais letras.');if(p.length<6)return aerr('A senha precisa ter pelo menos 6 caracteres.');if(p!==$('#ac').value)return aerr('As senhas não são iguais.')}
 loading=true;$('#ago').classList.add('load');aerr('');
 try{
  const r=mode==='up'?await sb.auth.signUp({email:e,password:p,options:{data:{usuario:u}}}):await sb.auth.signInWithPassword({email:e,password:p});
  if(r.error)throw r.error;
  if(!r.data.session){aerr('Conta criada! Confirme seu e-mail para poder entrar.')}else await enterApp(r.data.session.user);
 }catch(err){aerr(tr(err.message||String(err)))}
 loading=false;$('#ago').classList.remove('load');
}
$('#ago').onclick=submit;
['au','ae','ap','ac'].forEach(i=>$('#'+i).addEventListener('keydown',e=>{if(e.key==='Enter')submit()}));
$('#agoogle').onclick=async()=>{if(!sb)return aerr('O servidor ainda não está conectado ao Supabase. Veja o LEIA-ME.');const r=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin}});if(r.error)aerr(tr(r.error.message))};
function route(){if(!introDone||!booted)return;if(T0>1e11)T0=performance.now();
 if(user&&!pendingPw){AP.classList.remove('peek');AP.classList.add('go')}else{AP.classList.add('peek');AUTH.classList.add('show')}}
const provs=u=>[...new Set([...((u.app_metadata&&u.app_metadata.providers)||[]),...((u.identities||[]).map(i=>i.provider))])];
const soGoogle=u=>{const p=provs(u);return p.includes('google')&&!p.includes('email')};
const needsPw=u=>soGoogle(u)&&!(u.user_metadata&&u.user_metadata.senha_ok);
const semSenha=u=>soGoogle(u)&&!(u.user_metadata&&u.user_metadata.senha_def);
const closeAuth=()=>{AUTH.classList.add('out');setTimeout(()=>AUTH.classList.remove('show','out'),800)};
const DBG=/debug/.test(location.search);let dbgEl=null;
function dbg(t){if(!DBG)return;if(!dbgEl){dbgEl=document.createElement('pre');dbgEl.style.cssText='position:fixed;left:8px;bottom:8px;z-index:99;max-width:92vw;max-height:40vh;overflow:auto;margin:0;padding:8px 10px;font:11px/1.5 monospace;color:#fff;background:rgba(0,0,0,.85);border:1px solid #555;border-radius:8px;white-space:pre-wrap';document.body.append(dbgEl)}dbgEl.textContent+=t+'\n'}
async function finish(){$('#me').textContent=(nome()[0]||'?').toUpperCase();await loadAll();closeAuth();route()}
async function enterApp(u){if(user&&user.id===u.id)return;user=u;dbg('login: '+(u.email||'?')+' | provedores: '+provs(u).join(',')+' | pede senha: '+needsPw(u));if(needsPw(u)){pendingPw=true;manualPw=false;setMode('pw');$('#askip').textContent='agora não';route();return}await finish()}
$('#askip').onclick=async()=>{if(!sb)return;if(manualPw){manualPw=false;pendingPw=false;closeAuth();setMode('in');return}try{await sb.auth.updateUser({data:{senha_ok:true}})}catch(e){}pendingPw=false;await finish()};
function leave(){user=null;pendingPw=false;manualPw=false;cur=null;hist=[];facts=[];convs=[];pop.classList.remove('on');AP.classList.remove('go','chatting');$('#msgs').textContent='';drawMem();drawHist();['au','ae','ap','ac'].forEach(i=>$('#'+i).value='');setMode('in');route()}
async function boot(){
 dbg('versão 3 | url com retorno do Google: '+(/access_token|code=/.test(location.hash+location.search)?'sim':'não'));
 try{
  if(!window.supabase)throw new Error('lib');
  const c=await (await fetch('/api/config')).json();
  if(!c.url||!c.key)throw new Error('cfg');
  dbg('config do servidor: ok');
  sb=supabase.createClient(c.url,c.key);
  sb.auth.onAuthStateChange((ev,s)=>{dbg('evento: '+ev);if(ev==='SIGNED_OUT'&&user)leave();if(ev==='SIGNED_IN'&&s&&!user&&booted)setTimeout(()=>enterApp(s.user),0)});
  const {data}=await sb.auth.getSession();
  dbg('sessão: '+(data.session?'sim':'não'));
  if(data.session)await enterApp(data.session.user);
 }catch(e){const m=(e&&e.message)||String(e);dbg('erro: '+m);aerr(m==='cfg'||m==='lib'?'O servidor ainda não está conectado ao Supabase. Veja o LEIA-ME.':'Algo falhou ao entrar: '+m)}
 booted=true;route();
}
boot();
(function(){
 const vv=window.visualViewport,rs=document.documentElement.style,AP=$('#app');let maxH=0,lw=0;
 function fit(){const hh=Math.round(vv?vv.height:innerHeight),w=innerWidth;if(w!==lw){lw=w;maxH=0}maxH=Math.max(maxH,hh);rs.setProperty('--vh',hh+'px');rs.setProperty('--mh',Math.round(maxH*.4)+'px');scrollTo(0,0);sc()}
 fit();(vv||window).addEventListener('resize',fit);if(vv)vv.addEventListener('scroll',fit);
 $('#in').addEventListener('focus',()=>AP.classList.add('typing'));$('#in').addEventListener('blur',()=>AP.classList.remove('typing'));
})();
(function(){
 const IN=$('#intro'),AP=$('#app'),cnt=$('#icount'),tot=LY.reduce((s,L)=>s+L.c,0);let done=false;
 function enter(){if(done)return;done=true;IN.classList.add('out');introDone=true;route();setTimeout(()=>IN.remove(),1300)}
 if(matchMedia('(prefers-reduced-motion:reduce)').matches){IN.remove();introDone=true;T0=0;route();return}
 'SINJORINO'.split('').forEach((c,i)=>{const s=document.createElement('span');s.textContent=c;s.style.animationDelay=(1.2+i*.09)+'s';$('#iname').append(s)});
 const t0=performance.now();
 (function tick(){const p=Math.min(1,Math.max(0,(performance.now()-t0-800)/2200));cnt.textContent=fmt(tot*(1-Math.pow(1-p,3)))+' neurônios';if(!done&&p<1)requestAnimationFrame(tick)})();
 setTimeout(enter,3500);IN.addEventListener('pointerdown',enter);addEventListener('keydown',enter);
})();
