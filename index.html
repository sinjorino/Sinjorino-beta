<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"><title>Sinjorino</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
:root{--ink:#f2f2f2;--mut:#8a8a8a;--line:#2a2a2a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#000;color:var(--ink);font-family:"IBM Plex Mono",Consolas,ui-monospace,monospace;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:grid;grid-template-columns:54.5% 1fr}
.map{position:relative;overflow:hidden}
@keyframes fade{from{opacity:0}}
#net{position:absolute;inset:0}
.map::before{content:"";position:absolute;top:0;bottom:0;width:16%;left:-20%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);animation:scan 7s linear infinite;pointer-events:none}
.map::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.8));pointer-events:none}
@keyframes scan{to{left:115%}}
.side{position:relative;border-left:1px solid var(--line);display:flex;flex-direction:column;padding:0 24px;min-height:0}
@keyframes slide{from{opacity:0;transform:translateX(24px)}}
header{display:flex;align-items:center;gap:18px;padding:22px 0 18px;border-bottom:1px solid var(--line);position:relative}
.logo{width:50px;height:50px;flex:none}
.rg{transform-box:fill-box;transform-origin:center;animation:spin 22s linear infinite}
.wv{transform-box:fill-box;transform-origin:center;stroke-dasharray:6 3;animation:flow 1.6s linear infinite,amp 3.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-18}}
@keyframes amp{50%{transform:scaleY(1.45)}}
h1{font-weight:600;font-size:15px;letter-spacing:.42em;background:linear-gradient(90deg,#fff 30%,#777 50%,#fff 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
#sub{font-size:11px;color:var(--mut);margin-top:5px;font-weight:500;transition:color .4s}
.busy #sub{color:#fff}
.mem{margin-left:auto;font:inherit;font-size:11px;color:var(--mut);background:none;border:1px solid var(--line);padding:6px 10px;cursor:pointer;transition:.3s}
.mem:hover{color:#000;background:#fff;border-color:#fff}
.pop{display:none;position:absolute;right:0;top:78px;z-index:5;width:280px;padding:14px;font-size:12px;line-height:1.6;background:#0a0a0a;border:1px solid #444}
.pop.on{display:block;animation:rise .35s both}
.pop div{padding:5px 0;border-bottom:1px solid #222}
.pop button{margin-top:10px;font:inherit;font-size:11px;color:var(--mut);background:none;border:1px solid var(--line);padding:5px 10px;cursor:pointer}
.msgs{flex:1;min-height:0;overflow:auto;padding:18px 0;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.msgs::-webkit-scrollbar{display:none}
.m{border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.6);padding:14px 16px;font-size:13.5px;line-height:1.75;max-width:92%;white-space:pre-wrap;overflow-wrap:anywhere;animation:rise .55s cubic-bezier(.2,.8,.2,1) both;position:relative}
.m::before{display:block;font-size:9.5px;letter-spacing:.35em;color:#6d6d6d;margin-bottom:7px}
.m.a::before{content:"SINJORINO"}
.m.u::before{content:"VOCÊ"}
.m.u{align-self:flex-end;border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.06)}
.m.a{align-self:flex-start}
.m.live::after{content:"▍";animation:blink 1s steps(1) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(12px);filter:blur(5px)}}
.tg{display:inline-block;margin:12px 8px 0 0;font:inherit;font-size:11.5px;color:var(--ink);background:none;border:1px solid #555;padding:6px 10px;cursor:pointer;transition:.25s}
.tg:hover{background:#fff;color:#000;transform:translateY(-2px)}
.barw{padding:12px 0 22px}
.bar{position:relative;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 10px 40px rgba(0,0,0,.6);transition:.4s}
.bar::before{content:"";position:absolute;inset:-1px;border-radius:15px;padding:1px;pointer-events:none;background:conic-gradient(from var(--a),transparent 0 62%,rgba(255,255,255,.95) 82%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);opacity:.3;transition:opacity .4s;animation:rot 4s linear infinite}
@keyframes rot{to{--a:360deg}}
.bar:focus-within{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 0 4px rgba(255,255,255,.06),0 0 40px rgba(255,255,255,.12)}
.bar:focus-within::before,.busy .bar::before{opacity:1}
.pr{color:#fff;font-weight:600;animation:blink 1.2s steps(1) infinite}
#in{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:14px}
#in::placeholder{color:#7d7d7d}
kbd{font:inherit;font-size:10px;color:#777;border:1px solid #3a3a3a;padding:3px 6px;border-radius:5px}
#go{width:44px;height:44px;border:0;border-radius:10px;background:#fff;color:#000;cursor:pointer;display:grid;place-items:center;transition:.25s}
#go:hover{transform:translateY(-2px) scale(1.05);box-shadow:0 0 28px rgba(255,255,255,.45)}
#go:active{transform:scale(.93)}
.busy #go{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 30px rgba(255,255,255,.7)}}
@media(max-width:820px){
:root{--hh:64px}
.app{display:block;position:relative;height:calc(var(--vh,100dvh) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:hidden}
.map{position:absolute;left:0;right:0;top:var(--hh);height:var(--mh,40dvh);transform-origin:50% 0;transition:transform .9s cubic-bezier(.7,0,.2,1)}
.app.chatting .map,.app.typing .map{transform:scale(.36)}
.side{position:absolute;inset:0;border:0;padding:0 14px}
header{height:var(--hh);padding:0;gap:12px;border:0}
.logo{width:38px;height:38px}
h1{display:none}
#sub{margin:0;font-size:11px;line-height:1.4}
.mem{padding:8px 12px}
.pop{left:0;right:0;width:auto;top:var(--hh)}
.msgs{margin-top:calc(var(--mh,40dvh) + 2px);transition:margin-top .9s cubic-bezier(.7,0,.2,1);padding:10px 0}
.app.chatting .msgs,.app.typing .msgs{margin-top:calc(var(--mh,40dvh)*.36 + 6px)}
.m{font-size:14px;padding:12px 14px;max-width:94%}
.tg{padding:10px 12px}
.barw{padding:8px 0 12px}
#in{font-size:16px}
kbd{display:none}
#go{width:46px;height:46px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.app:not(.go) .map,.app:not(.go) .side{opacity:0;animation:unhide 0s 8s forwards}
.app.go .map{animation:fade 2s both}
.app.go .side{animation:slide 1s .15s cubic-bezier(.2,.8,.2,1) both}
@keyframes unhide{to{opacity:1}}
#intro{position:fixed;inset:0;z-index:50;background:#000;display:grid;place-items:center;cursor:pointer;transition:opacity 1s,filter 1s,transform 1.2s cubic-bezier(.7,0,.2,1);animation:gone 0s 9s forwards}
#intro.out{opacity:0;filter:blur(14px);transform:scale(1.12);pointer-events:none}
@keyframes gone{to{opacity:0;visibility:hidden;pointer-events:none}}
.ig{position:relative;display:flex;flex-direction:column;align-items:center;gap:24px}
.ilogo{width:96px;height:96px;overflow:visible;filter:drop-shadow(0 0 14px rgba(255,255,255,.35))}
.d1,.d2{stroke-dasharray:1;stroke-dashoffset:1;stroke-width:1.6;stroke-linecap:round;animation:draw 1.4s .2s cubic-bezier(.6,0,.2,1) forwards}
.d2{stroke-width:2;animation-delay:.8s}
@keyframes draw{to{stroke-dashoffset:0}}
.rings{position:absolute;left:50%;top:48px}
.rings i{position:absolute;left:0;top:0;width:96px;height:96px;margin:-48px 0 0 -48px;border:1px solid rgba(255,255,255,.35);border-radius:50%;opacity:0;animation:ring 3s .9s ease-out infinite}
.rings i:nth-child(2){animation-delay:1.6s}.rings i:nth-child(3){animation-delay:2.3s}
@keyframes ring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(4.5);opacity:0}}
.iname{display:flex;font-size:30px;font-weight:600;letter-spacing:.42em;margin-right:-.42em;height:40px}
.iname span{opacity:0;filter:blur(10px);transform:translateY(10px);animation:letter .8s forwards}
@keyframes letter{to{opacity:1;filter:blur(0);transform:none}}
.ibar{width:220px;height:1px;background:#222;overflow:hidden}
.ibar b{display:block;height:100%;background:#fff;transform:scaleX(0);transform-origin:left;animation:load 2.2s .8s cubic-bezier(.5,0,.2,1) forwards}
@keyframes load{to{transform:scaleX(1)}}
.icount{font-size:11px;color:#8a8a8a;letter-spacing:.15em;height:14px}
.iskip{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));font-size:10px;letter-spacing:.3em;color:#555;text-transform:uppercase;animation:blink 2s steps(1) infinite}
@media(max-width:820px){.iname{font-size:22px}}
</style></head><body>
<div id="intro"><div class="ig"><div class="rings"><i></i><i></i><i></i></div><svg class="ilogo" viewBox="0 0 48 48" fill="none" stroke="#fff"><circle class="d1" cx="24" cy="24" r="22" pathLength="1"/><path class="d2" pathLength="1" d="M8 28c4 0 4-12 8-12s4 12 8 12 4-12 8-12 4 12 8 12"/></svg><div class="iname" id="iname" aria-label="Sinjorino"></div><div class="ibar"><b></b></div><div class="icount" id="icount"></div></div><div class="iskip">toque para pular</div></div>
<div class="app" id="app">
<section class="map" id="map"><canvas id="net"></canvas></section>
<section class="side">
<header><svg class="logo" viewBox="0 0 48 48" fill="none" stroke="#fff"><circle class="rg" cx="24" cy="24" r="22.5" stroke-width="1" stroke-dasharray="2 4" opacity=".6"/><circle cx="24" cy="24" r="19" stroke-width="2"/><path class="wv" d="M8 28c4 0 4-12 8-12s4 12 8 12 4-12 8-12 4 12 8 12" stroke-width="2.2" stroke-linecap="round"/></svg>
<div><h1>SINJORINO</h1><p id="sub"></p></div><button class="mem" id="mem">memória · <b id="mc">0</b></button><div class="pop" id="pop"></div></header>
<div class="msgs" id="msgs"></div>
<div class="barw"><div class="bar"><span class="pr">›</span><input id="in" placeholder="pergunte algo ao Sinjorino…" autocomplete="off" enterkeyhint="send"><kbd>enter</kbd><button id="go" aria-label="Enviar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 5v7a3 3 0 0 1-3 3H5M9 10l-4 5 4 5"/></svg></button></div></div>
</section></div>
<script>
const $=s=>document.querySelector(s),R=Math.random;let T0=1e12;
const cv=$('#net'),cx=cv.getContext('2d'),map=$('#map'),DPR=Math.min(devicePixelRatio||1,2);
let W=1,H=1,busy=false,mx=-999,my=-999,hist=[],facts=[],ti,outK=-1,outG=0,R0=9.5,lastAct=-2,nodes=[],edges=[],dust=[],strm=[],stars=[],pulses=[];
try{hist=JSON.parse(localStorage.getItem('s_h')||'[]');facts=JSON.parse(localStorage.getItem('s_f')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('s_h',JSON.stringify(hist.slice(-40)));localStorage.setItem('s_f',JSON.stringify(facts.slice(-40)))}catch(e){}};
const LY=[{n:15,x:.235,name:'entrada',c:1200000},{n:20,x:.458,name:'oculta 1',c:3500000},{n:13,x:.679,name:'oculta 2',c:2300000},{n:11,x:.88,name:'saída',c:11}];
const fmt=n=>Math.round(n).toLocaleString('pt-BR'),PH=['lendo as palavras…','ativando oculta 1…','ativando oculta 2…','escolhendo a resposta…'];
function build(){
 W=map.clientWidth||1;H=map.clientHeight||1;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';
 R0=Math.min(9.5,H*.74/19*.42);nodes=[];edges=[];pulses=[];const idx=[];
 LY.forEach((L,l)=>{idx[l]=[];for(let j=0;j<L.n;j++){idx[l][j]=nodes.length;nodes.push({l,j,x:W*L.x,y:H*.14+H*.74*j/(L.n-1),g:0,out:[]})}});
 for(let l=0;l<3;l++)for(const a of idx[l])for(const b of idx[l+1]){edges.push({a,b});nodes[a].out.push(edges.length-1)}
 dust=[];for(let l=0;l<3;l++)for(let i=0;i<(W<600?220:450);i++)dust.push({x:W*LY[l].x+(R()+R()+R()-1.5)*W*.05,y:H*.08+R()*H*.84,ph:R()*6.28});
 strm=[];for(let i=0;i<(W<600?360:800);i++)strm.push({l:i%3,y0:H*.08+R()*H*.84,y1:H*.08+R()*H*.84,p:R(),s:.002+R()*.004});
 stars=[];for(let i=0;i<(W<600?45:90);i++)stars.push({x:R()*W,y:R()*H,vx:(R()-.5)*.3,vy:(R()-.5)*.3});
}
const spawn=n=>pulses.push({e:n.out[Math.floor(R()*n.out.length)],p:0,s:.016+R()*.014});
function brace(x,y1,y2){const m=(y1+y2)/2,r=10;cx.beginPath();cx.moveTo(x+r,y1);cx.quadraticCurveTo(x,y1,x,y1+r);cx.lineTo(x,m-r);cx.quadraticCurveTo(x,m,x-r,m);cx.quadraticCurveTo(x,m,x,m+r);cx.lineTo(x,y2-r);cx.quadraticCurveTo(x,y2,x+r,y2);cx.stroke()}
function frame(t){
 requestAnimationFrame(frame);
 cx.setTransform(DPR,0,0,DPR,0,0);cx.clearRect(0,0,W,H);
 const ez=1-Math.pow(1-Math.min(1,Math.max(0,(t-T0)/2600)),3),sp=busy?2:1,act=busy?Math.floor(t/520)%4:-1;
 cx.fillStyle='rgba(255,255,255,.35)';
 for(const s of stars){s.x+=s.vx*sp;s.y+=s.vy*sp;if(s.x<0)s.x=W;if(s.x>W)s.x=0;if(s.y<0)s.y=H;if(s.y>H)s.y=0;cx.fillRect(s.x,s.y,1.6,1.6)}
 cx.lineWidth=1;
 for(let i=0;i<stars.length;i++)for(let j=i+1;j<stars.length;j++){const a=stars[i],b=stars[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<110){cx.strokeStyle='rgba(255,255,255,'+(1-d/110)*.13+')';cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke()}}
 if(pulses.length<200&&R()<(busy?.8:.05)){const n=nodes[Math.floor(R()*LY[0].n)];n.g=1;spawn(n)}
 if(busy){const w=(t/520)%4;for(const n of nodes)if(n.l===Math.floor(w))n.g=Math.max(n.g,.5)}
 cx.strokeStyle='rgba(255,255,255,'+(busy?.085:.04)*ez+')';cx.beginPath();
 for(const e of edges){const a=nodes[e.a],b=nodes[e.b];cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y)}cx.stroke();
 for(const d of dust){cx.fillStyle='rgba(255,255,255,'+Math.min(.8,(.12+.3*Math.abs(Math.sin(t/1200+d.ph)))*(busy?1.6:1))*ez+')';cx.fillRect(d.x,d.y,1.2,1.2)}
 for(const s of strm){s.p+=s.s*(busy?3:1);if(s.p>1){s.p=0;s.y0=H*.08+R()*H*.84;s.y1=H*.08+R()*H*.84}const a=LY[s.l],b=LY[s.l+1];cx.fillStyle='rgba(255,255,255,'+Math.sin(3.1416*s.p)*(busy?.75:.38)*ez+')';cx.fillRect(W*(a.x+(b.x-a.x)*s.p),s.y0+(s.y1-s.y0)*s.p,1.5,1.5)}
 for(let i=pulses.length-1;i>=0;i--){
  const u=pulses[i],e=edges[u.e],A=nodes[e.a],B=nodes[e.b];u.p+=u.s*(busy?1.7:1);
  if(u.p>=1){B.g=1;pulses.splice(i,1);if(B.out.length)spawn(B);continue}
  const x=A.x+(B.x-A.x)*u.p,y=A.y+(B.y-A.y)*u.p,q=Math.max(0,u.p-.2),xa=A.x+(B.x-A.x)*q,ya=A.y+(B.y-A.y)*q,g=cx.createLinearGradient(xa,ya,x,y);
  g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(255,255,255,.95)');cx.strokeStyle=g;cx.lineWidth=1.6;cx.beginPath();cx.moveTo(xa,ya);cx.lineTo(x,y);cx.stroke();
 }
 outG*=.996;
 for(const n of nodes){
  n.g*=.94;const d=Math.hypot(n.x-mx,n.y-my);if(d<70)n.g=Math.max(n.g,(1-d/70)*.7);
  const r=R0+Math.sin(t/900+n.x)*.4+n.g*1.5,a=ez;
  if(n.g>.25){cx.strokeStyle='rgba(255,255,255,'+n.g*.35*a+')';cx.lineWidth=1;cx.beginPath();cx.arc(n.x,n.y,r+4+(1-n.g)*14,0,6.283);cx.stroke()}
  cx.fillStyle='rgba(0,0,0,.9)';cx.beginPath();cx.arc(n.x,n.y,r,0,6.283);cx.fill();
  cx.strokeStyle='rgba(255,255,255,'+(.5+n.g*.5)*a+')';cx.lineWidth=1.3;cx.stroke();
  if(n.g>.05){cx.fillStyle='rgba(255,255,255,'+Math.min(1,n.g)+')';cx.beginPath();cx.arc(n.x,n.y,r*.55*Math.min(1,n.g+.2),0,6.283);cx.fill()}
  if(n.l===3){cx.textAlign='left';cx.font='600 12px "IBM Plex Mono",monospace';const on=n.j===outK;cx.fillStyle='rgba(255,255,255,'+(on?.4+outG*.6:.5)+')';cx.fillText(n.j,n.x+R0+10,n.y+4);if(on&&outG>.05){cx.fillRect(n.x+R0+36,n.y-1,26*outG,2)}}
 }
 cx.textAlign='center';
 LY.forEach((L,l)=>{const on=act===l;cx.font='600 11px "IBM Plex Mono",monospace';cx.fillStyle='rgba(255,255,255,'+(on?1:.5)*ez+')';cx.fillText(L.name,W*L.x,H*.05);cx.font='10px "IBM Plex Mono",monospace';cx.fillStyle='rgba(255,255,255,'+(on?.85:.3)*ez+')';cx.fillText(l<3?fmt(L.c*ez):'11 classes',W*L.x,H*.05+15)});
 const bx=W*LY[0].x-Math.max(24,Math.min(34,W/22)),fs=Math.max(13,Math.min(22,W/32));
 cx.strokeStyle='rgba(255,255,255,'+(busy?.9:.45)*ez+')';cx.lineWidth=1.2;brace(bx,H*.14-10,H*.88+10);
 cx.font=fs+'px "Times New Roman",serif';cx.textAlign='right';cx.fillStyle='rgba(255,255,255,'+ez+')';cx.fillText((LY[0].c/1e6*ez).toFixed(1).replace('.',',')+' mi',bx-16,H*.51+fs/3);
 if(busy&&act!==lastAct){lastAct=act;$('#sub').textContent=PH[act]}
}
new ResizeObserver(build).observe(map);
map.addEventListener('pointermove',e=>{const r=map.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top});
map.addEventListener('pointerleave',()=>{mx=my=-999});
requestAnimationFrame(frame);

const subIdle=()=>'pronta · '+(LY.reduce((s,L)=>s+L.c,0)/1e6).toFixed(1).replace('.',',')+' milhões de neurônios · '+hist.filter(h=>h.role==='assistant').length+' respostas';
function setBusy(b){busy=b;lastAct=-2;$('#app').classList.toggle('busy',b);
 if(b){for(let i=0;i<14;i++)spawn(nodes[Math.floor(R()*LY[0].n)])}else{$('#sub').textContent=subIdle();nodes.forEach(n=>n.g=Math.max(n.g,.7))}}
const sc=()=>{const m=$('#msgs');m.scrollTop=m.scrollHeight};
function add(c,t){if(c==='u')$('#app').classList.add('chatting');const d=document.createElement('div');d.className='m '+c;d.textContent=t;$('#msgs').append(d);sc();return d}
const drawMem=()=>$('#mc').textContent=facts.length;
async function api(body){
 let r;try{r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}catch(e){throw new Error('Sem conexão com o servidor. Verifique sua internet.')}
 const d=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(d.error||('O servidor não respondeu (erro '+r.status+'). Confira se a pasta api com o arquivo chat.js foi enviada ao GitHub.'));
 return d}
async function learn(t){
 if(t.length<20)return;
 try{const d=await api({task:'facts',text:t});
  if(Array.isArray(d.facts)){d.facts.forEach(f=>{if(typeof f==='string'&&f&&!facts.includes(f))facts.push(f.slice(0,120))});save();drawMem()}
 }catch(e){}
}
async function type(el,text){const st=Math.max(2,Math.ceil(text.length/110));for(let i=0;i<text.length;i+=st){el.textContent=text.slice(0,i+st);sc();await new Promise(r=>setTimeout(r,16))}el.textContent=text}
async function send(txt){
 if(busy||!txt)return;
 const tm=txt.match(/^ensinar:\s*(.+?)\s*=\s*(.+)$/i);
 add('u',txt);
 if(tm){facts.push('ensinado: “'+tm[1].slice(0,80)+'” → “'+tm[2].slice(0,120)+'”');save();drawMem();hist.push({role:'user',content:txt},{role:'assistant',content:'Aprendido. Agora sei responder “'+tm[1]+'”.'});add('a','Aprendido. Agora sei responder “'+tm[1]+'”.');save();nodes.forEach(n=>n.g=1);$('#sub').textContent=subIdle();return}
 hist.push({role:'user',content:txt});
 const el=add('a','');el.classList.add('live');setBusy(true);
 try{
  let m=hist.slice(-14);while(m.length&&m[0].role!=='user')m.shift();
  const d=await api({messages:m,facts});
  await type(el,d.text);hist.push({role:'assistant',content:d.text});save();learn(txt);
  outK=Math.abs([...d.text].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7))%11;outG=1;nodes[nodes.length-11+outK].g=1;
 }catch(e){
  hist.pop();el.textContent=(e&&e.message)||'Não consegui responder agora. Tente novamente em instantes.';
 }finally{el.classList.remove('live');setBusy(false)}
}
function go(){const v=$('#in').value.trim();if(!v||busy)return;$('#in').value='';send(v)}
$('#go').onclick=go;
$('#in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go()}});
$('#mem').onclick=()=>{const p=$('#pop');p.classList.toggle('on');p.textContent='';
 if(!facts.length){p.textContent='Ainda não guardei nada sobre você.';return}
 facts.forEach(f=>{const d=document.createElement('div');d.textContent=f;p.append(d)});
 const b=document.createElement('button');b.textContent='esquecer tudo';b.onclick=()=>{facts=[];save();drawMem();p.classList.remove('on')};p.append(b)};
const hi=add('a','Olá! Eu sou o Sinjorino, uma rede neural com milhões de neurônios, pronta para conversar. Tente “o que é uma rede neural?” ou ensine algo novo com “ensinar: pergunta = resposta”.');
[['o que é uma rede neural?',1],['ensinar: ',0]].forEach(([q,s])=>{const b=document.createElement('button');b.className='tg';b.textContent=q.trim();b.onclick=()=>{if(s)send(q);else{$('#in').value=q;$('#in').focus()}};hi.append(b)});
hist.forEach(h=>add(h.role==='user'?'u':'a',h.content));
drawMem();$('#sub').textContent=subIdle();
(function(){
 const vv=window.visualViewport,rs=document.documentElement.style,AP=$('#app');let maxH=0,lw=0;
 function fit(){const hh=Math.round(vv?vv.height:innerHeight),w=innerWidth;if(w!==lw){lw=w;maxH=0}maxH=Math.max(maxH,hh);rs.setProperty('--vh',hh+'px');rs.setProperty('--mh',Math.round(maxH*.4)+'px');scrollTo(0,0);sc()}
 fit();(vv||window).addEventListener('resize',fit);if(vv)vv.addEventListener('scroll',fit);
 $('#in').addEventListener('focus',()=>AP.classList.add('typing'));$('#in').addEventListener('blur',()=>AP.classList.remove('typing'));
})();
(function(){
 const IN=$('#intro'),AP=$('#app'),cnt=$('#icount'),tot=LY.reduce((s,L)=>s+L.c,0);let done=false;
 function enter(){if(done)return;done=true;IN.classList.add('out');AP.classList.add('go');T0=performance.now();setTimeout(()=>IN.remove(),1300)}
 if(matchMedia('(prefers-reduced-motion:reduce)').matches){IN.remove();AP.classList.add('go');T0=0;return}
 'SINJORINO'.split('').forEach((c,i)=>{const s=document.createElement('span');s.textContent=c;s.style.animationDelay=(1.2+i*.09)+'s';$('#iname').append(s)});
 const t0=performance.now();
 (function tick(){const p=Math.min(1,Math.max(0,(performance.now()-t0-800)/2200));cnt.textContent=fmt(tot*(1-Math.pow(1-p,3)))+' neurônios';if(!done&&p<1)requestAnimationFrame(tick)})();
 setTimeout(enter,3500);IN.addEventListener('pointerdown',enter);addEventListener('keydown',enter);
})();
